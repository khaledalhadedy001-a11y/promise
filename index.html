<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهام التشغيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: sticky header, status tabs with live counts, task list grouped by priority, detail sheet slides in from the side (full screen on phones) */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#13242b; --muted:#5b6c73; --line:#d9e1e4;
  --accent:#0b6b72; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --p-urgent:#c0352a; --p-urgent-soft:#fbe5e2; --p-high:#b8680f; --p-high-soft:#fbeedb;
  --p-normal:#36689a; --p-normal-soft:#e2ecf6; --p-low:#77858b; --p-low-soft:#eceff0;
  --ok:#2c7a4b; --ok-soft:#e0f1e6; --warn:#9a5a00; --warn-soft:#fff1d6;
  --shadow:0 12px 40px rgba(14,35,42,.18);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1518; --surface:#142026; --surface-2:#18262d; --ink:#e3ebee; --muted:#8fa2a9; --line:#243740;
  --accent:#43b6b2; --accent-ink:#06211f; --accent-soft:#11373a;
  --p-urgent:#f0776c; --p-urgent-soft:#3a1d1b; --p-high:#e9a24e; --p-high-soft:#3a2a15;
  --p-normal:#79a8d8; --p-normal-soft:#1a2c3d; --p-low:#9aa7ac; --p-low-soft:#222e33;
  --ok:#6cc792; --ok-soft:#153222; --warn:#e8b45a; --warn-soft:#3a2c12;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1518; --surface:#142026; --surface-2:#18262d; --ink:#e3ebee; --muted:#8fa2a9; --line:#243740;
  --accent:#43b6b2; --accent-ink:#06211f; --accent-soft:#11373a;
  --p-urgent:#f0776c; --p-urgent-soft:#3a1d1b; --p-high:#e9a24e; --p-high-soft:#3a2a15;
  --p-normal:#79a8d8; --p-normal-soft:#1a2c3d; --p-low:#9aa7ac; --p-low-soft:#222e33;
  --ok:#6cc792; --ok-soft:#153222; --warn:#e8b45a; --warn-soft:#3a2c12;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body)}
#app{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{color:var(--p-urgent);border-color:var(--p-urgent-soft)}
.btn.danger.armed{background:var(--p-urgent);color:var(--surface);border-color:var(--p-urgent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* demo strip */
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px}
.demo b{color:var(--ink)}
.demo .btn{font-size:12px;padding:3px 10px}
.demo .btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-inline-end:auto;min-width:0}
.brand h1{font-size:19px;font-weight:700}
.brand span{font-size:12px;color:var(--muted)}
.who{font-size:13px;color:var(--muted);text-align:left}
.who b{color:var(--ink);font-weight:600}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* tabs with counts */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;padding-block:16px 8px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:right;display:flex;flex-direction:column;gap:2px}
.tab .n{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tab .l{font-size:13px;color:var(--muted)}
.tab.attn .n{color:var(--p-urgent)}
.tab.waiting .n{color:var(--warn)}
.tab.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tab.on .l{color:var(--ink)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding-block:8px 4px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-width:0}
.toolbar input{flex:1 1 220px}

/* list */
.group{margin-top:18px}
.group-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:0 4px 6px}
.group-h .sw{width:10px;height:10px;border-radius:3px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;align-items:start}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.row-top{display:flex;gap:8px;align-items:baseline;min-width:0}
.ref{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;flex:none}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-meta,.row-last{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-last{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.s-new{background:var(--p-urgent-soft);color:var(--p-urgent);border-color:transparent}
.pill.s-assigned{background:var(--p-normal-soft);color:var(--p-normal);border-color:transparent}
.pill.s-in_progress{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.s-pending_approval{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.s-closed{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pri::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pri.urgent{background:var(--p-urgent-soft);color:var(--p-urgent)}
.pri.high{background:var(--p-high-soft);color:var(--p-high)}
.pri.normal{background:var(--p-normal-soft);color:var(--p-normal)}
.pri.low{background:var(--p-low-soft);color:var(--p-low)}
.sw.urgent{background:var(--p-urgent)}.sw.high{background:var(--p-high)}.sw.normal{background:var(--p-normal)}.sw.low{background:var(--p-low)}
.due{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--p-urgent);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
main{padding-bottom:48px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,22,26,.42);z-index:20}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sheet-bar .ref{font-size:13px}
.sheet-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.d-head{display:flex;flex-direction:column;gap:8px}
.d-head h2{font-size:21px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0;padding:12px;background:var(--surface-2);border-radius:10px}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.details{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.actions{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px}
.actions h3,.timeline-h{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.act-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act-row select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;flex:1 1 160px}
.hint{font-size:13px;color:var(--muted);margin:0}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 18px 14px 0;border-right:2px solid var(--line);margin-right:5px}
.timeline li:last-child{border-right-color:transparent}
.timeline li::before{content:"";position:absolute;right:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline li.note::before{background:var(--accent);border-color:var(--accent)}
.tl-meta{font-size:12px;color:var(--muted)}
.tl-meta b{color:var(--ink);font-weight:600}
.tl-text{overflow-wrap:anywhere;white-space:pre-wrap}
.timeline li.event .tl-text{color:var(--muted);font-size:14px}
.composer{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;resize:vertical;min-height:44px;max-height:180px;background:var(--surface-2)}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,22,26,.42)}
.modal-card{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 16px);overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal-card > header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-card > header h2{font-size:18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px;min-width:0;width:100%}
.form-foot{display:flex;gap:8px;justify-content:flex-start;padding:0 18px 16px;flex-wrap:wrap}
.err{color:var(--p-urgent);font-size:13px;margin:0;grid-column:1/-1}
.users{list-style:none;margin:0;padding:0 18px}
.users li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.users .u-main{flex:1 1 180px;min-width:0}
.users .u-main b{display:block}
.users .u-main span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.users li.off .u-main{opacity:.5}
.sub-h{padding:14px 18px 0;font-size:14px;color:var(--muted)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login-card h1{font-size:24px}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.login-card .field input{background:var(--surface-2)}
.demo-pick{display:flex;flex-direction:column;gap:8px}
.demo-pick .btn{justify-content:space-between}
.demo-pick .btn span{color:var(--muted);font-size:13px}

#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:620px){
  .row{grid-template-columns:1fr}
  .row-side{flex-direction:row;align-items:center;flex-wrap:wrap;justify-content:flex-start}
  .form{grid-template-columns:1fr}
  .who{display:none}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .tab{flex:0 0 auto;min-width:104px}
  .tab .n{font-size:20px}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar"></div>
<div id="toast" hidden></div>

<script type="module">
/* ============ الإعدادات — غيّرها بعد إنشاء مشروع Firebase ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD-7latIkGl3vQ4dE8lapKDOIREBMkz-hg",
  authDomain: "tasks-ops.firebaseapp.com",
  projectId: "tasks-ops",
  storageBucket: "tasks-ops.firebasestorage.app",
  messagingSenderId: "773091705898",
  appId: "1:773091705898:web:4ae08acc81d0067dd2ef53",
  measurementId: "G-L67YQQZ8VH"
};
// صاحب السيستم (المشرف). أول دخول بالإيميل ده بيعمل له حساب مشرف تلقائياً
const OWNER_EMAIL = "khaledalhadedy001@gmail.com";
/* ==================================================================== */

const DEMO = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("PASTE");
document.documentElement.dir = "rtl"; document.documentElement.lang = "ar";

const PRI = { urgent:{l:"عاجل جداً",r:0}, high:{l:"أولوية عالية",r:1}, normal:{l:"عادية",r:2}, low:{l:"منخفضة",r:3} };
const ST = { new:"بانتظار التوزيع", assigned:"تم التوزيع", in_progress:"جاري التنفيذ", pending_approval:"بانتظار الاعتماد", closed:"مغلقة" };
const TYPES = ["حجز فندق","طيران","تأشيرة","نقل ومواصلات","برنامج سياحي","عمرة / حج","متابعة عميل","أخرى"];
const ROLE = { supervisor:"مشرف التشغيل", manager:"المدير", employee:"موظف" };
const NOW = { __now:true };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms = t => t == null ? Date.now() : typeof t === "number" ? t : t.toMillis ? t.toMillis() : +new Date(t);
const pad = n => String(n).padStart(4, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtNum = n => Number(n).toLocaleString("ar-EG");
const rtf = new Intl.RelativeTimeFormat("ar-EG", { numeric:"auto" });
function ago(t){ const s = (ms(t) - Date.now())/1000, a = Math.abs(s);
  if (a < 60) return "الآن";
  if (a < 3600) return rtf.format(Math.round(s/60), "minute");
  if (a < 86400) return rtf.format(Math.round(s/3600), "hour");
  if (a < 86400*30) return rtf.format(Math.round(s/86400), "day");
  return new Date(ms(t)).toLocaleDateString("ar-EG", { day:"numeric", month:"short" }); }
function fullDate(t){ return new Date(ms(t)).toLocaleString("ar-EG", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" }); }
function dueInfo(t){
  if (!t.due) return null;
  const today = todayStr();
  const days = Math.round((new Date(t.due) - new Date(today)) / 86400000);
  const d = new Date(t.due + "T00:00").toLocaleDateString("ar-EG", { day:"numeric", month:"short" });
  if (t.status === "closed") return { cls:"", txt:"التسليم " + d };
  if (days < 0) return { cls:"late", txt: days === -1 ? "متأخرة يوم" : days === -2 ? "متأخرة يومين" : "متأخرة " + fmtNum(-days) + (-days <= 10 ? " أيام" : " يوم") };
  if (days === 0) return { cls:"today", txt:"التسليم اليوم" };
  if (days === 1) return { cls:"", txt:"التسليم بكرة" };
  return { cls:"", txt:"التسليم " + d };
}
const isLate = t => t.status !== "closed" && t.due && t.due < todayStr();
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }

/* ====================== Firebase ====================== */
async function makeFirebase(){
  const V = "10.12.2", base = "https://www.gstatic.com/firebasejs/" + V + "/";
  const [AP, A, F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
  const app = AP.initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app), db = F.getFirestore(app);
  const fix = o => { const r = {}; for (const k in o) r[k] = o[k] === NOW ? F.serverTimestamp() : o[k]; return r; };
  const withId = d => ({ id:d.id, ...d.data() });

  async function loadProfile(u){
    const ref = F.doc(db, "users", u.uid);
    let s = await F.getDoc(ref);
    if (!s.exists() && (u.email||"").toLowerCase() === OWNER_EMAIL.toLowerCase()){
      await F.setDoc(ref, { name:"المشرف", email:u.email, role:"supervisor", active:true, createdAt:F.serverTimestamp() });
      s = await F.getDoc(ref);
    }
    if (!s.exists()) return { blocked:"الحساب ده مش متسجل في السيستم. كلم المشرف." };
    const p = { uid:u.uid, ...s.data() };
    if (p.active === false) return { blocked:"الحساب ده متوقف. كلم المشرف." };
    return p;
  }
  return {
    demo:false,
    onAuth(cb){ A.onAuthStateChanged(auth, async u => { if (!u) return cb(null); try { cb(await loadProfile(u)); } catch(e){ console.error(e); cb({ blocked:"مفيش صلاحية للدخول. اتأكد إن قواعد Firestore اتنشرت." }); } }); },
    login:(e,p) => A.signInWithEmailAndPassword(auth, e, p),
    logout:() => A.signOut(auth),
    watchTasks(me, cb){
      const col = F.collection(db, "tasks");
      const q = me.role === "employee" ? F.query(col, F.where("assignedTo","==",me.uid)) : col;
      return F.onSnapshot(q, s => cb(s.docs.map(withId)), e => { console.error(e); toast("مش قادر يقرا المهام"); });
    },
    watchUsers(cb){ return F.onSnapshot(F.collection(db,"users"), s => cb(s.docs.map(d => ({ uid:d.id, ...d.data() }))), e => console.error(e)); },
    watchUpdates(id, cb){ return F.onSnapshot(F.query(F.collection(db,"tasks",id,"updates"), F.orderBy("createdAt")), s => cb(s.docs.map(withId)), e => console.error(e)); },
    async createTask(data, me, text){
      const counter = F.doc(db, "meta", "counter"), ref = F.doc(F.collection(db, "tasks"));
      await F.runTransaction(db, async tx => {
        const c = await tx.get(counter); const n = (c.exists() ? c.data().n : 0) + 1;
        tx.set(counter, { n });
        tx.set(ref, fix({ ...data, no:n, createdAt:NOW, updatedAt:NOW, lastUpdate:text, lastUpdateBy:me.name, lastUpdateAt:NOW }));
      });
      await F.addDoc(F.collection(db,"tasks",ref.id,"updates"), { kind:"event", text, by:me.uid, byName:me.name, role:me.role, createdAt:F.serverTimestamp() });
      return ref.id;
    },
    async act(id, me, patch, entry){
      const b = F.writeBatch(db);
      b.update(F.doc(db,"tasks",id), fix({ ...patch, updatedAt:NOW, lastUpdate:entry.text.slice(0,160), lastUpdateBy:me.name, lastUpdateAt:NOW }));
      b.set(F.doc(F.collection(db,"tasks",id,"updates")), { kind:entry.kind, text:entry.text, by:me.uid, byName:me.name, role:me.role, createdAt:F.serverTimestamp() });
      await b.commit();
    },
    deleteTask:id => F.deleteDoc(F.doc(db,"tasks",id)),
    async createUser({ name, email, password, role }){
      const sec = AP.initializeApp(FIREBASE_CONFIG, "sec-" + Date.now());
      try {
        const sa = A.getAuth(sec);
        const cred = await A.createUserWithEmailAndPassword(sa, email, password);
        await F.setDoc(F.doc(db,"users",cred.user.uid), { name, email, role, active:true, createdAt:F.serverTimestamp() });
        await A.signOut(sa);
      } finally { await AP.deleteApp(sec); }
    },
    updateUser:(uid, patch) => F.updateDoc(F.doc(db,"users",uid), patch),
    resetPassword:email => A.sendPasswordResetEmail(auth, email)
  };
}

  let me = null, authCb = () => {};

  const visible = (m) => m.role === "employee" ? tasks.filter(t => t.assignedTo === m.uid) : tasks;
  const emitT = () => tSubs.forEach(s => s.cb(visible(s.me).map(t => ({ ...t }))));
  const emitU = () => uSubs.forEach(cb => cb(users.map(u => ({ ...u }))));
  const emitUp = id => (upSubs.get(id) || new Set()).forEach(cb => cb([...(updates[id] || [])]));
  const fix = o => { const r = {}; for (const k in o) r[k] = o[k] === NOW ? Date.now() : o[k]; return r; };
  const later = f => new Promise(r => setTimeout(() => r(f()), 120));
  return {
    demo:true, users,
    onAuth(cb){ authCb = cb; cb(null); },
    demoLogin(uid){ me = { ...U(uid) }; authCb(me); },
    login(){ return Promise.reject(new Error("demo")); },
    logout(){ me = null; authCb(null); },
    watchTasks(m, cb){ const s = { me:m, cb }; tSubs.add(s); emitT(); return () => tSubs.delete(s); },
    watchUsers(cb){ uSubs.add(cb); emitU(); return () => uSubs.delete(cb); },
    watchUpdates(id, cb){ if (!upSubs.has(id)) upSubs.set(id, new Set()); upSubs.get(id).add(cb); cb([...(updates[id] || [])]); return () => upSubs.get(id).delete(cb); },
    createTask(data, m, text){ return later(() => { const id = "t" + (++counter); const n = Date.now();
      tasks.push({ ...data, id, no:counter, createdAt:n, updatedAt:n, lastUpdate:text, lastUpdateBy:m.name, lastUpdateAt:n });
      updates[id] = [{ id:"x"+n, kind:"event", text, by:m.uid, byName:m.name, role:m.role, createdAt:n }]; emitT(); return id; }); },
    act(id, m, patch, entry){ return later(() => { const t = tasks.find(x => x.id === id); const n = Date.now();
      Object.assign(t, fix(patch), { updatedAt:n, lastUpdate:entry.text.slice(0,160), lastUpdateBy:m.name, lastUpdateAt:n });
      (updates[id] ||= []).push({ id:"x"+n, kind:entry.kind, text:entry.text, by:m.uid, byName:m.name, role:m.role, createdAt:n }); emitT(); emitUp(id); }); },
    deleteTask(id){ return later(() => { tasks.splice(tasks.findIndex(t => t.id === id), 1); emitT(); }); },
    createUser({ name, email, role }){ return later(() => { users.push({ uid:"u"+Date.now(), name, email, role, active:true }); emitU(); }); },
    updateUser(uid, patch){ return later(() => { Object.assign(U(uid), patch); emitU(); }); },
    resetPassword(){ return later(() => {}); }
  };
}

function filtered(){

  else if (k === "late") t = t.filter(isLate);

      out.push(`<div class="act-row"><label for="priSel" class="hint">الأولوية</label><select id="priSel">${Object.keys(PRI).map(p => `<option value="${p}" ${t.priority === p ? "selected" : ""}>${PRI[p].l}</option>`).join("")}</select></div>`);
    }
    if (st === "pending_approval") out.push(`<p class="hint">${esc(t.assignedToName)} خلّصت المهمة. اعتمد الإغلاق، أو اكتب السبب تحت ورجّعها.</p><div class="act-row"><button class="btn ok" data-act="approve">اعتماد وإغلاق</button><button class="btn" data-act="return">إرجاع للموظف</button></div>`);
    else if (st === "in_progress" || st === "assigned") out.push(`<div class="act-row"><button class="btn" data-act="approve">إغلاق المهمة مباشرة</button></div>`);
    if (st === "closed") out.push(`<div class="act-row"><button class="btn" data-act="reopen">إعادة فتح</button></div>`);
    out.push(`<div class="act-row"><button class="btn danger sm ${S.armedDel ? "armed" : ""}" data-act="delete">${S.armedDel ? "اضغط تاني لتأكيد الحذف" : "حذف المهمة"}</button></div>`);
  } else if (r === "employee"){
    if (st === "assigned") out.push(`<div class="act-row"><button class="btn primary" data-act="start">بدء التنفيذ</button></div>`);
    if (st === "in_progress") out.push(`<p class="hint">لما تخلص اكتب ملخص اللي عملته تحت (اختياري) واضغط الزرار.</p><div class="act-row"><button class="btn ok" data-act="done">خلصت — إرسال للاعتماد</button></div>`);
    if (st === "pending_approval") out.push(`<p class="hint">المهمة مستنية اعتماد المشرف. هتفضل ظاهرة لحد ما يقفلها.</p>`);
    if (st === "closed") out.push(`<p class="hint">المهمة اتقفلت.</p>`);
  } else {
    if (st === "new") out.push(`<p class="hint">المهمة وصلت للمشرف ومستنية التوزيع.</p>`);
    else if (st === "closed") out.push(`<p class="hint">المهمة اتقفلت.</p>`);
    else out.push(`<p class="hint">تقدر تكتب ملاحظة أو استفسار تحت، وهيوصل للمشرف والموظف.</p>`);
  }
  return out.length ? `<section class="actions"><h3>الإجراءات</h3>${out.join("")}</section>` : "";
}
function renderDetail(){
  if (!sheetEl) return;
  const t = S.tasks.find(x => x.id === S.openId);
  if (!t){ closeTask(); return; }
  const d = dueInfo(t);
  $("#sheetRef").textContent = "#" + pad(t.no);
  const facts = [["النوع", t.type], ["العميل", t.client], ["التليفون", t.phone ? `<span dir="ltr">${esc(t.phone)}</span>` : ""], ["مع", t.assignedToName || "لسه ما اتوزعتش"],
    ["أرسلها", t.createdByName], ["اتعملت", fullDate(t.createdAt)], ["موعد التسليم", t.due ? new Date(t.due+"T00:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"}) : ""],
    t.closedAt && t.status === "closed" ? ["اتقفلت", fullDate(t.closedAt)] : null].filter(f => f && f[1]);
  $("#sheetBody").innerHTML = `
    <div class="d-head"><h2>${esc(t.title)}</h2><div class="chips"><span class="pri ${t.priority}">${PRI[t.priority].l}</span><span class="pill s-${t.status}">${ST[t.status]}</span>${d ? `<span class="due ${d.cls}">${d.txt}</span>` : ""}</div></div>
    <dl class="facts">${facts.map(([k,v]) => `<div><dt>${k}</dt><dd>${k === "التليفون" ? v : esc(v)}</dd></div>`).join("")}</dl>
    ${t.details ? `<p class="details">${esc(t.details)}</p>` : ""}
    ${actionsHtml(t)}
    <section><h3 class="timeline-h">سجل المتابعة</h3>
      <ol class="timeline">${S.updates.map(u => `<li class="${u.kind}"><div class="tl-meta"><b>${esc(u.byName)}</b> (${ROLE[u.role] || ""}) — ${ago(u.createdAt)}</div><div class="tl-text">${esc(u.text)}</div></li>`).join("") || `<li class="event"><div class="tl-text">لسه مفيش تحديثات.</div></li>`}</ol></section>`;
  const comp = $("#composer");
  comp.hidden = t.status === "closed" && S.me.role === "employee";
}
function onSheetClick(e){
  if (e.target.closest("[data-close]")) return closeTask();
  const b = e.target.closest("[data-act]"); if (b) doAct(b.dataset.act, b);
}
function onSheetChange(e){
  if (e.target.id === "priSel"){ const p = e.target.value; doAct("priority", null, p); }
}
async function doAct(kind, btn, val){
  const t = S.tasks.find(x => x.id === S.openId); if (!t) return;
  const me = S.me, txtEl = $("#updText"), text = txtEl.value.trim();
  let patch = {}, entry = null;
  switch (kind){
    case "note": if (!text) return toast("اكتب التحديث الأول"); entry = { kind:"note", text }; break;
    case "assign": {
      const uid = $("#assignSel").value; if (!uid) return toast("اختار الموظف الأول");
      const u = S.users.find(x => x.uid === uid);
      patch = { assignedTo:uid, assignedToName:u.name, status: t.status === "new" ? "assigned" : t.status };
      entry = { kind:"event", text:(t.assignedTo ? "حوّل المهمة من " + t.assignedToName + " إلى " : "وزّع المهمة على ") + u.name }; break; }
    case "priority": patch = { priority:val }; entry = { kind:"event", text:"غيّر الأولوية إلى «" + PRI[val].l + "»" }; break;
    case "start": patch = { status:"in_progress" }; entry = { kind:"event", text:"بدأ التنفيذ" }; break;
    case "done": patch = { status:"pending_approval" }; entry = { kind:"event", text:"أنهى المهمة وأرسلها للاعتماد" + (text ? ":\n" + text : "") }; break;
    case "approve": patch = { status:"closed", closedAt:NOW, closedBy:me.name }; entry = { kind:"event", text:"اعتمد الإغلاق" + (text ? ":\n" + text : "") }; break;
    case "return": if (!text) { txtEl.focus(); return toast("اكتب سبب الإرجاع في خانة التحديث تحت"); }
      patch = { status:"in_progress" }; entry = { kind:"event", text:"رجّع المهمة للتعديل:\n" + text }; break;
    case "reopen": patch = { status: t.assignedTo ? "assigned" : "new" }; entry = { kind:"event", text:"أعاد فتح المهمة" + (text ? ":\n" + text : "") }; break;
    case "delete":
      if (!S.armedDel){ S.armedDel = true; renderDetail(); setTimeout(() => { if (S.armedDel){ S.armedDel = false; renderDetail(); } }, 4000); return; }
      try { await api.deleteTask(t.id); closeTask(); toast("المهمة اتحذفت"); } catch(x){ console.error(x); toast("الحذف ما نجحش"); }
      return;
  }
  if (btn) btn.disabled = true;
  try {
    await api.act(t.id, me, patch, entry);
    if (["note","done","approve","return","reopen"].includes(kind)) txtEl.value = "";
    toast({ note:"التحديث اتبعت", assign:"المهمة اتوزعت", priority:"الأولوية اتغيرت", start:"بالتوفيق!", done:"اتبعتت للمشرف للاعتماد", approve:"المهمة اتقفلت", return:"المهمة رجعت للموظف", reopen:"المهمة اتفتحت تاني" }[kind]);
  } catch(x){ console.error(x); toast("العملية ما نجحتش، جرّب تاني"); }
  finally { if (btn) btn.disabled = false; }
}

/* ---------- مهمة جديدة ---------- */
function modal(title, body){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="btn ghost sm" data-x aria-label="إغلاق">✕</button></header>${body}</div>`;
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-x]")) m.remove(); });
  document.body.appendChild(m); return m;
}
function openNewTask(){
  const sup = S.me.role === "supervisor";
  const m = modal("مهمة جديدة", `<form class="form" id="ntForm" novalidate>
    <div class="field full"><label for="nt-title">المهمة *</label><input id="nt-title" required placeholder="مثلاً: تأكيد حجز فندق لوفد يوم ٢٠"></div>
    <div class="field"><label for="nt-type">النوع</label><select id="nt-type">${TYPES.map(x => `<option>${x}</option>`).join("")}</select></div>
    <div class="field"><label for="nt-pri">الأولوية</label><select id="nt-pri">${Object.keys(PRI).map(p => `<option value="${p}" ${p === "normal" ? "selected" : ""}>${PRI[p].l}</option>`).join("")}</select></div>
    <div class="field"><label for="nt-client">العميل</label><input id="nt-client"></div>
    <div class="field"><label for="nt-phone">التليفون</label><input id="nt-phone" type="tel" dir="ltr"></div>
    <div class="field"><label for="nt-due">موعد التسليم</label><input id="nt-due" type="date" min="${todayStr()}"></div>
    ${sup ? `<div class="field"><label for="nt-assign">توزيع على</label><select id="nt-assign"><option value="">بعدين</option>${staff().map(u => `<option value="${u.uid}">${esc(u.uid === S.me.uid ? u.name + " (أنا)" : u.name)}</option>`).join("")}</select></div>` : `<div class="field"></div>`}
    <div class="field full"><label for="nt-details">التفاصيل</label><textarea id="nt-details" rows="4"></textarea></div>
    <p class="err" id="nt-err" hidden></p>
    </form><div class="form-foot"><button class="btn primary" id="ntSave">${sup ? "حفظ المهمة" : "إرسال للمشرف"}</button><button class="btn ghost" data-x>إلغاء</button></div>`);
  $("#nt-title").focus();
  const save = async () => {
    const title = $("#nt-title").value.trim(), er = $("#nt-err");
    if (!title){ er.textContent = "اكتب عنوان المهمة."; er.hidden = false; return; }
    const aid = sup ? $("#nt-assign").value : "", au = S.users.find(u => u.uid === aid);
    const data = { title, type:$("#nt-type").value, priority:$("#nt-pri").value, client:$("#nt-client").value.trim(), phone:$("#nt-phone").value.trim(),
      due:$("#nt-due").value || "", details:$("#nt-details").value.trim(), status: au ? "assigned" : "new", assignedTo: au ? au.uid : "", assignedToName: au ? au.name : "",
      createdBy:S.me.uid, createdByName:S.me.name, createdByRole:S.me.role };
    $("#ntSave").disabled = true;
    try {
      const id = await api.createTask(data, S.me, au ? "أنشأ المهمة ووزّعها على " + au.name : "أنشأ المهمة");
      m.remove(); toast(sup ? "المهمة اتحفظت" : "المهمة اتبعتت للمشرف"); S.tab = "open"; renderBoard();
    } catch(x){ console.error(x); er.textContent = "الحفظ ما نجحش. اتأكد من النت وجرّب تاني."; er.hidden = false; $("#ntSave").disabled = false; }
  };
  $("#ntSave").onclick = save;
  $("#ntForm").addEventListener("submit", e => { e.preventDefault(); save(); });
}

/* ---------- فريق العمل ---------- */
function openTeam(){
  const m = modal("فريق العمل", `<ul class="users" id="uList"></ul>
    <h3 class="sub-h">إضافة حساب</h3>
    <form class="form" id="uForm" novalidate>
      <div class="field"><label for="u-name">الاسم</label><input id="u-name" required></div>
      <div class="field"><label for="u-role">الدور</label><select id="u-role"><option value="employee">موظف</option><option value="manager">المدير</option><option value="supervisor">مشرف</option></select></div>
      <div class="field"><label for="u-email">الإيميل</label><input id="u-email" type="email" dir="ltr" required></div>
      <div class="field"><label for="u-pass">كلمة السر (٦ حروف على الأقل)</label><input id="u-pass" type="text" dir="ltr" required></div>
      <p class="err" id="u-err" hidden></p>
    </form><div class="form-foot"><button class="btn primary" id="uSave">إضافة الحساب</button></div>`);
  const draw = () => {
    if (!document.body.contains(m)) return;
    $("#uList").innerHTML = S.users.slice().sort((a,b) => ["supervisor","manager","employee"].indexOf(a.role) - ["supervisor","manager","employee"].indexOf(b.role))
      .map(u => `<li class="${u.active === false ? "off" : ""}"><div class="u-main"><b>${esc(u.name)}</b><span>${ROLE[u.role]} — <span dir="ltr">${esc(u.email)}</span>${u.active === false ? " — متوقف" : ""}</span></div>
        ${u.uid === S.me.uid ? "" : `<button class="btn sm" data-reset="${esc(u.email)}">إعادة تعيين كلمة السر</button><button class="btn sm" data-toggle="${u.uid}">${u.active === false ? "تفعيل" : "إيقاف"}</button>`}</li>`).join("");
  };
  draw(); const un = api.watchUsers(us => { S.users = us; draw(); });
  new MutationObserver((_, o) => { if (!document.body.contains(m)){ un(); o.disconnect(); } }).observe(document.body, { childList:true });
  m.addEventListener("click", async e => {
    const tg = e.target.closest("[data-toggle]"), rs = e.target.closest("[data-reset]");
    if (tg){ const u = S.users.find(x => x.uid === tg.dataset.toggle); await api.updateUser(u.uid, { active: u.active === false }); toast(u.active === false ? "الحساب اتفعّل" : "الحساب اتوقف"); }
    if (rs){ try { await api.resetPassword(rs.dataset.reset); toast(DEMO ? "في النسخة الحقيقية هيوصله إيميل لتغيير كلمة السر" : "اتبعت إيميل تغيير كلمة السر"); } catch(x){ toast("ما قدرتش أبعت الإيميل"); } }
  });
  $("#uSave").onclick = async () => {
    const er = $("#u-err"), name = $("#u-name").value.trim(), email = $("#u-email").value.trim(), password = $("#u-pass").value, role = $("#u-role").value;
    er.hidden = true;
    if (!name || !email || password.length < 6){ er.textContent = "اكتب الاسم والإيميل وكلمة سر ٦ حروف أو أكتر."; er.hidden = false; return; }
    $("#uSave").disabled = true;
    try { await api.createUser({ name, email, password, role }); ["u-name","u-email","u-pass"].forEach(i => $("#"+i).value = ""); toast("الحساب اتعمل. ابعت الإيميل وكلمة السر للشخص."); }
    catch(x){ console.error(x); er.textContent = x.code === "auth/email-already-in-use" ? "الإيميل ده مستخدم قبل كده." : x.code === "auth/invalid-email" ? "الإيميل مكتوب غلط." : "ما قدرتش أعمل الحساب."; er.hidden = false; }
    finally { $("#uSave").disabled = false; }
  };
}

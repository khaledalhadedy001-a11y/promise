<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهام التشغيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: deep-teal header band with view switcher (list / calendar / performance), colored status tabs, rows grouped by priority, side sheet for task detail */
:root{
  --bg:#edf2f2; --surface:#ffffff; --surface-2:#f4f7f7; --ink:#10252b; --muted:#5a6e74; --line:#d6e0e1;
  --brand:#0a4c54; --brand-2:#0e5f68; --brand-ink:#ffffff; --brand-muted:#a9cfd2;
  --accent:#0b7a80; --accent-ink:#ffffff; --accent-soft:#d8eeee; --gold:#d8961a;
  --p-immediate:#a3175a; --p-urgent:#c3312a; --p-high:#c66a0c; --p-normal:#2f69a6; --p-low:#77858b;
  --ok:#25804c; --warn:#a35f00; --on-hue:#ffffff;
  --t-hotel:#0f8a7e; --t-flight:#2f6fd1; --t-visa:#8a4fc4; --t-transport:#d46a12; --t-program:#3a943a; --t-umrah:#b0840c; --t-follow:#4b7795; --t-other:#7a868a; --t-money:#a8327a;
  --shadow:0 14px 44px rgba(10,40,46,.2);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1417; --surface:#132025; --surface-2:#18272d; --ink:#e2ebed; --muted:#8fa3a9; --line:#243840;
  --brand:#0a3439; --brand-2:#10454b; --brand-ink:#e9f6f6; --brand-muted:#8cbcc0;
  --accent:#41b5b0; --accent-ink:#04201e; --accent-soft:#113a3c; --gold:#f0b440;
  --p-immediate:#f27cb0; --p-urgent:#f07468; --p-high:#eb9d47; --p-normal:#77a7dc; --p-low:#9aa8ad;
  --ok:#62c48b; --warn:#e8b257; --on-hue:#0c1417;
  --t-hotel:#3fc2b3; --t-flight:#79a6f0; --t-visa:#b98ae8; --t-transport:#f0a05a; --t-program:#78c978; --t-umrah:#e3bb4b; --t-follow:#8fb4cf; --t-other:#a3afb3; --t-money:#e58ac4;
  --shadow:0 14px 44px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1417; --surface:#132025; --surface-2:#18272d; --ink:#e2ebed; --muted:#8fa3a9; --line:#243840;
  --brand:#0a3439; --brand-2:#10454b; --brand-ink:#e9f6f6; --brand-muted:#8cbcc0;
  --accent:#41b5b0; --accent-ink:#04201e; --accent-soft:#113a3c; --gold:#f0b440;
  --p-immediate:#f27cb0; --p-urgent:#f07468; --p-high:#eb9d47; --p-normal:#77a7dc; --p-low:#9aa8ad;
  --ok:#62c48b; --warn:#e8b257; --on-hue:#0c1417;
  --t-hotel:#3fc2b3; --t-flight:#79a6f0; --t-visa:#b98ae8; --t-transport:#f0a05a; --t-program:#78c978; --t-umrah:#e3bb4b; --t-follow:#8fb4cf; --t-other:#a3afb3; --t-money:#e58ac4;
  --shadow:0 14px 44px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body)}
#app{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}

/* hue helpers: color per travel type / person */
.c-hotel{--h:var(--t-hotel)}.c-flight{--h:var(--t-flight)}.c-visa{--h:var(--t-visa)}.c-transport{--h:var(--t-transport)}.c-program{--h:var(--t-program)}.c-umrah{--h:var(--t-umrah)}.c-follow{--h:var(--t-follow)}.c-other{--h:var(--t-other)}.c-money{--h:var(--t-money)}
.p-immediate{--h:var(--p-immediate)}.p-urgent{--h:var(--p-urgent)}.p-high{--h:var(--p-high)}.p-normal{--h:var(--p-normal)}.p-low{--h:var(--p-low)}
.s-new{--h:var(--p-urgent)}.s-assigned{--h:var(--p-normal)}.s-in_progress{--h:var(--accent)}.s-pending_approval{--h:var(--warn)}.s-closed{--h:var(--ok)}
.tag,.pill,.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;color:var(--h);background:color-mix(in srgb,var(--h) 14%,transparent)}
.pri::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--h);color:var(--on-hue);font-size:13px;font-weight:600;flex:none;font-family:var(--f-display)}
.av.lg{width:40px;height:40px;font-size:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover,.btn.ok:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.danger{color:var(--p-urgent);border-color:color-mix(in srgb,var(--p-urgent) 30%,transparent)}
.btn.danger.armed{background:var(--p-urgent);color:var(--surface);border-color:var(--p-urgent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* demo strip */
.demo{background:color-mix(in srgb,var(--gold) 18%,var(--surface));color:var(--ink);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px}
.demo .btn{font-size:12px;padding:3px 10px}
.demo .btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* header band */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.top-row{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--brand);display:grid;place-items:center;font:700 19px/1 var(--f-display)}
.brand h1{font-size:18px;font-weight:700}
.brand span{font-size:12px;color:var(--brand-muted)}
.views{display:flex;gap:4px;background:var(--brand-2);border-radius:11px;padding:4px;margin-inline-start:auto}
.views button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--brand-muted);padding:6px 12px;border-radius:8px;font-weight:500}
.views button.on{background:var(--surface);color:var(--ink)}
.views button:not(.on):hover{color:var(--brand-ink)}
.head-actions{display:flex;gap:8px;align-items:center}
.hbtn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--brand-ink) 25%,transparent);background:transparent;color:var(--brand-ink);border-radius:9px;padding:7px 11px;font-weight:500}
.hbtn:hover{background:var(--brand-2)}
.hbtn.solid{background:var(--gold);border-color:var(--gold);color:var(--brand)}
.hbtn.solid:hover{filter:brightness(1.06)}
.badge{position:absolute;top:-6px;left:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--p-urgent);color:var(--surface);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* status tabs */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding-block:18px 8px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:right;display:flex;align-items:center;gap:10px;min-width:0}
.tab .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--h) 15%,transparent);color:var(--h);font:600 17px/1 var(--f-display);font-variant-numeric:tabular-nums;flex:none}
.tab .l{font-size:13px;color:var(--muted);line-height:1.3}
.tab.on{border-color:var(--h);box-shadow:inset 0 0 0 1px var(--h)}
.tab.on .l{color:var(--ink);font-weight:600}
.tab.zero .dot{background:var(--surface-2);color:var(--muted)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding-block:8px 4px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;min-width:0}
.toolbar input{flex:1 1 220px}
.alert-strip{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;border:0;border-radius:11px;padding:10px 14px;background:color-mix(in srgb,var(--p-urgent) 13%,var(--surface));color:var(--p-urgent);font-weight:600;text-align:right}
.alert-strip span{margin-inline-start:auto;font-weight:500;font-size:13px}

/* list */
.group{margin-top:18px}
.group-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--h);padding:0 4px 6px}
.group-h::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--h)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;width:100%;text-align:right;border-bottom:1px solid var(--line);padding:12px 16px;align-items:start;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.row-top{display:flex;gap:8px;align-items:baseline;min-width:0;flex-wrap:wrap}
.ref{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;flex:none}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.row-last{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--p-urgent);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.qbtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 12px;font-size:13px;font-weight:600}
.qbtn:hover{background:var(--accent);color:var(--accent-ink)}
.qbtn.ok{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.qbtn.ok:hover{background:var(--ok);color:var(--surface)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
main{padding-bottom:56px}
.stars-sm{display:inline-flex;color:var(--gold)}
.stars-sm .ic{width:13px;height:13px}
.stars-sm .off{color:var(--line)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:18px 10px}
.cal-head h2{font-size:20px;margin-inline-end:auto}
.cal-nav{display:flex;gap:6px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dn{font-size:12px;color:var(--muted);font-weight:600;padding:8px;text-align:center;border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal-cell{min-height:104px;border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:none;padding:6px;text-align:right;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-cell:nth-child(7n){border-left:0}
.cal-cell.blank{background:var(--surface-2);cursor:default}
.cal-cell:not(.blank):hover{background:var(--surface-2)}
.cal-n{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal-cell.today .cal-n{background:var(--accent);color:var(--accent-ink)}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-chip{font-size:11px;line-height:1.4;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--h) 15%,transparent);color:var(--h);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.cal-chip.done{opacity:.55;text-decoration:line-through}
.cal-more{font-size:11px;color:var(--muted)}
.cal-dots{display:none;gap:3px;flex-wrap:wrap}
.cal-dots i{width:7px;height:7px;border-radius:50%;background:var(--h)}
.cal-dots i.done{opacity:.4}
.day-h{display:flex;align-items:baseline;gap:8px;margin:20px 4px 8px}
.day-h h3{font-size:16px}
.day-h span{font-size:13px;color:var(--muted)}

/* performance */
.perf-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:18px 6px}
.perf-head h2{font-size:20px;margin-inline-end:auto}
.perf-note{font-size:13px;color:var(--muted);margin:0 0 12px}
.perf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard-h{display:flex;align-items:center;gap:10px}
.pcard-h b{font-family:var(--f-display);font-size:17px;display:block}
.pcard-h span{font-size:12px;color:var(--muted)}
.rating-big{display:flex;align-items:center;gap:8px}
.rating-big strong{font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.rating-big .stars-sm .ic{width:17px;height:17px}
.rating-big small{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:9px;padding:8px 10px;min-width:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font:600 17px/1.3 var(--f-display);font-variant-numeric:tabular-nums}
.kv dd.bad{color:var(--p-urgent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.recent li{display:flex;gap:6px;align-items:baseline;min-width:0}
.recent li span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* bell panel */
.pop{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:16px;width:min(380px,calc(100% - 32px));max-height:calc(100% - 90px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:15;display:flex;flex-direction:column}
.pop h3{font-size:14px;padding:12px 14px 6px}
.pop h3.late{color:var(--p-urgent)}.pop h3.soon{color:var(--warn)}
.pop-item{display:flex;flex-direction:column;gap:2px;border:0;background:none;text-align:right;padding:8px 14px;border-bottom:1px solid var(--line)}
.pop-item:hover{background:var(--surface-2)}
.pop-item b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.pop-set{padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;font-size:13px}
.pop-set label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pop-set select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px}
.pop-empty{padding:18px 14px;color:var(--muted);font-size:14px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,24,28,.45);z-index:20}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(580px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sheet-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.d-head{display:flex;flex-direction:column;gap:8px}
.d-head h2{font-size:21px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0;padding:12px;background:var(--surface-2);border-radius:12px}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.contact a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:9px;padding:7px 12px;font-weight:600;font-size:14px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.contact a.wa{background:color-mix(in srgb,var(--t-program) 14%,transparent);border-color:transparent;color:var(--t-program)}
.details{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.actions{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px}
.actions h3,.timeline-h{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.act-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act-row select,.act-row input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;flex:1 1 160px}
.approve-box{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.hint{font-size:13px;color:var(--muted);margin:0}
.stars{display:flex;gap:2px;direction:ltr;justify-content:flex-end}
.stars button{border:0;background:none;padding:2px;color:var(--line)}
.stars button.on{color:var(--gold)}
.stars button .ic{width:28px;height:28px}
.rated{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 18px 14px 0;border-right:2px solid var(--line);margin-right:5px}
.timeline li:last-child{border-right-color:transparent}
.timeline li::before{content:"";position:absolute;right:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline li.note::before{background:var(--accent);border-color:var(--accent)}
.tl-meta{font-size:12px;color:var(--muted)}
.tl-meta b{color:var(--ink);font-weight:600}
.tl-text{overflow-wrap:anywhere;white-space:pre-wrap}
.timeline li.event .tl-text{color:var(--muted);font-size:14px}
.composer{border-top:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick .chip{flex:none}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;resize:vertical;min-height:44px;max-height:180px;background:var(--surface-2)}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(8,24,28,.45)}
.modal-card{background:var(--surface);border-radius:16px;width:min(580px,100%);max-height:calc(100% - 16px);overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal-card > header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-card > header h2{font-size:18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lbl{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 12px;min-width:0;width:100%}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.type-pick{display:flex;gap:6px;flex-wrap:wrap}
.type-pick button{border:1px solid transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--h);background:color-mix(in srgb,var(--h) 12%,transparent)}
.type-pick button.on{background:var(--h);color:var(--on-hue)}
.form-foot{display:flex;gap:8px;justify-content:flex-start;padding:0 18px 16px;flex-wrap:wrap}
.err{color:var(--p-urgent);font-size:13px;margin:0;grid-column:1/-1}
.users{list-style:none;margin:0;padding:0 18px}
.users li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.users .u-main{flex:1 1 180px;min-width:0}
.users .u-main b{display:block}
.users .u-main span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.users li.off .u-main{opacity:.5}
.sub-h{padding:14px 18px 0;font-size:14px;color:var(--muted)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--brand)}
.login-card{width:min(400px,100%);background:var(--surface);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login-card h1{font-size:24px}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.demo-pick{display:flex;flex-direction:column;gap:8px}
.demo-pick .btn{justify-content:space-between}
.demo-pick .btn span{color:var(--muted);font-size:13px}

/* urgent section, day summary, handoff, files */
.hot{margin-top:18px;border-radius:16px;padding:12px;background:color-mix(in srgb,var(--p-urgent) 8%,var(--bg));border:1px solid color-mix(in srgb,var(--p-urgent) 30%,transparent)}
.hot-h{display:flex;align-items:center;gap:8px;color:var(--p-urgent);font:600 16px/1.3 var(--f-display);padding:2px 4px 4px}
.hot .group:first-of-type{margin-top:8px}
.today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.today h2{grid-column:1/-1;font-size:16px}
.today div{display:flex;flex-direction:column;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--h) 10%,transparent);min-width:0}
.today b{font:600 22px/1.2 var(--f-display);color:var(--h);font-variant-numeric:tabular-nums}
.today span{font-size:12px;color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;color:var(--h);background:color-mix(in srgb,var(--h) 12%,transparent)}
.f-hand{--h:var(--t-visa)}.f-ext{--h:var(--warn)}.f-stale{--h:var(--t-transport)}.f-file{--h:var(--t-follow)}
.handbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--t-visa) 10%,var(--surface))}
.handbox textarea,.extbox textarea,.extbox input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-width:0;width:100%}
.extbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.files{display:flex;flex-direction:column;gap:8px}
.file-chips{display:flex;gap:6px;flex-wrap:wrap}
.file-chips a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:600;padding:4px 10px;border-radius:8px;color:var(--t-follow);background:color-mix(in srgb,var(--t-follow) 12%,transparent);direction:ltr}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
/* مسارات التنفيذ */
.f-trk{--h:var(--accent)}.f-trk.all{--h:var(--ok)}
.av-stack{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end}
.av-stack .av{box-shadow:0 0 0 2px var(--surface)}.av-stack .av+.av{margin-left:-9px}
.trks{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.trks-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.trk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trk{--h:var(--p-normal);display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-right:4px solid var(--h);background:var(--surface)}
.trk.st-in_progress{--h:var(--accent)}.trk.st-done{--h:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.trk.me{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.trk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.trk-top b{flex:1;min-width:0}
.trk-st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;color:var(--h);background:color-mix(in srgb,var(--h) 14%,transparent)}
.trk-note{margin:0;font-size:14px}.trk-meta{font-size:12px;color:var(--muted)}
.trk-done{margin:0;font-size:13px;white-space:pre-wrap;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.splitbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.split-row{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:8px;align-items:center}
.split-row input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-width:0;width:100%}
.nt-notes{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#nt-assign button{--h:var(--accent)}
/* priority board + date view */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px;align-items:start}
.kcol{background:color-mix(in srgb,var(--h) 7%,var(--bg));border:1px solid color-mix(in srgb,var(--h) 28%,var(--line));border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol-h{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--h);padding:4px 6px 2px}
.kcol-h::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--h)}
.kcol-h span{margin-inline-start:auto;background:var(--h);color:var(--on-hue);border-radius:99px;padding:0 10px;font-size:13px;font-variant-numeric:tabular-nums}
.kcol-b{display:flex;flex-direction:column;gap:8px}
.kcol .row{background:var(--surface);border:1px solid var(--line);border-radius:12px;grid-template-columns:auto 1fr;padding:10px 12px}
.kcol .row:hover{border-color:var(--h)}
.kcol .row-side{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.kempty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;margin:0}
.kswitch{display:none}
.kbtn{border:1px solid color-mix(in srgb,var(--h) 35%,var(--line));background:var(--surface);color:var(--h);border-radius:11px;padding:6px 4px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.kbtn b{font:600 19px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kbtn.on{background:var(--h);border-color:var(--h);color:var(--on-hue)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:8px 14px;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.dgroup-h{display:flex;align-items:baseline;gap:8px;font-size:15px;padding:0 4px 6px;margin-top:18px}
.dgroup-h span{font-size:13px;color:var(--muted);font-weight:500}
.dlist .row{grid-template-columns:auto 1fr}
.dlist .row-side{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.created{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:900px){
  .board{grid-template-columns:1fr;margin-top:10px}
  .kcol:not(.on){display:none}
  .kswitch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
}
/* attendance */
.att-wrap{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.att-me{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.att-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--h) 12%,var(--surface))}
.att-status.in{--h:var(--ok)}.att-status.out{--h:var(--p-low)}
.att-status .dotbig{width:14px;height:14px;border-radius:50%;background:var(--h);flex:none}
.att-status b{font:600 18px/1.3 var(--f-display);color:var(--ink)}
.att-status span{color:var(--muted);font-size:14px}
.att-me input{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface-2);font:600 18px/1 var(--f-display);letter-spacing:.15em;width:180px;max-width:100%;text-transform:uppercase}
.att-sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.att-sec > header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.att-sec > header h2{font-size:18px;margin-inline-end:auto}
.att-today{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pcell{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--h)}
.pcell.in{--h:var(--ok)}.pcell.left{--h:var(--p-normal)}.pcell.absent{--h:var(--line)}
.pcell-h{display:flex;align-items:center;gap:8px}
.pcell-h b{flex:1;min-width:0}
.pcell dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:0}
.pcell dt{font-size:11px;color:var(--muted)}
.pcell dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12px;text-align:right;padding:8px 10px;white-space:nowrap}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.sum td{font-weight:600}
.tbl td.warn{color:var(--warn);font-weight:600}
.tbl td.good{color:var(--ok);font-weight:600}
.f-early{--h:var(--ok)}.f-ontime{--h:var(--p-normal)}.f-late{--h:var(--p-urgent)}
.tbl input,.tbl select{border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface);font-size:13px}
.tbl button{margin-inline-start:4px}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.set-grid > div{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);min-width:0}
.set-grid h3{font-size:15px}
.set-grid select,.set-grid input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface);min-width:0}
.pm-ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:color-mix(in srgb,var(--h) 15%,transparent);color:var(--h)}
.pm-ico .ic{width:30px;height:30px}
.pm{padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.pm.ok{--h:var(--ok)}.pm.err{--h:var(--p-urgent)}.pm.busy{--h:var(--accent)}
.pm p{margin:0;font-size:16px}
@media (max-width:620px){ .set-grid{grid-template-columns:1fr} }
.scan-box{position:relative;margin:16px 18px 10px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1;max-width:100%}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:16%;border:3px solid var(--gold);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
/* collection sheet */
.colsec{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.col-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col-head h3{margin-inline-end:auto}
.col-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.col-stats div{background:var(--surface-2);border-radius:9px;padding:6px 8px;min-width:0}
.col-stats dt{font-size:11px;color:var(--muted)}
.col-stats dd{margin:0;font:600 15px/1.3 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.col-stats .got{color:var(--ok)}.col-stats .left{color:var(--p-urgent)}
.col-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.col-row{border:1px solid var(--line);border-inline-start:4px solid var(--h);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.col-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.col-top b{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.col-top a{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);color:var(--ink)}
.col-top a.wa{color:var(--t-program)}
.col-f{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;align-items:end}
.col-f label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);min-width:0}

.col-f .rest{font-size:12px;color:var(--muted);text-align:center;padding-bottom:6px;white-space:nowrap}
.col-f .rest b{display:block;font-size:14px;color:var(--p-urgent);font-variant-numeric:tabular-nums}
.col-f .rest b.zero{color:var(--ok)}
.col-meta{font-size:11px;color:var(--muted)}
.r-none{--h:var(--line)}.r-paid{--h:var(--ok)}.r-partial{--h:var(--accent)}.r-promise{--h:var(--warn)}.r-noanswer{--h:var(--p-low)}.r-wrong,.r-refused{--h:var(--p-urgent)}
.col-add{display:grid;grid-template-columns:1.6fr 1.2fr 1fr auto;gap:6px}
.col-add input,.col-bulk textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--surface-2);min-width:0;width:100%}
.col-bulk summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.col-bulk{display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){ .col-f{grid-template-columns:1fr 1fr} .col-add{grid-template-columns:1fr 1fr} .col-stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* deadline popup */
.dl-modal{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:16px;background:rgba(60,8,8,.55)}
.dl-card{width:min(520px,100%);max-height:calc(100% - 16px);overflow-y:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border-top:6px solid var(--p-urgent);display:flex;flex-direction:column}
.dl-top{display:flex;gap:12px;align-items:flex-start;padding:18px 18px 8px}
.dl-top .ic{width:34px;height:34px;color:var(--p-urgent)}
.dl-top h2{font-size:20px;color:var(--p-urgent)}
.dl-top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.dl-item{margin:8px 18px;padding:12px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.dl-item b{overflow-wrap:anywhere}
.dl-foot{padding:10px 18px 18px;display:flex;justify-content:flex-start}
@media (prefers-reduced-motion:no-preference){ .dl-card{animation:pop .25s ease-out} @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}} }
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .tab{flex:0 0 auto}
  .views{order:3;width:100%;margin-inline-start:0}
  .views button{flex:1;justify-content:center;padding:6px 4px;font-size:14px}
  .head-actions{margin-inline-start:auto}
  .hbtn .txt{display:none}
  .cal-cell{min-height:58px;padding:4px}
  .cal-items{display:none}
  .cal-dots{display:flex}
  .cal-dn{font-size:11px;padding:6px 2px}
  .today{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .row{grid-template-columns:auto 1fr}
  .row-side{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap;justify-content:flex-start}
  .form{grid-template-columns:1fr}
  .brand span{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}}
}

function ago(t){ const s = (ms(t) - Date.now())/1000, a = Math.abs(s);
  if (a < 60) return "الآن";
  if (a < 3600) return rtf.format(Math.round(s/60), "minute");
  if (a < 86400) return rtf.format(Math.round(s/3600), "hour");
  if (a < 86400*30) return rtf.format(Math.round(s/86400), "day");
  return new Date(ms(t)).toLocaleDateString("ar-EG", { day:"numeric", month:"short" }); }
function span(d){ // مدة بالعامية
  const m = Math.round(d / MIN);
  if (m < 60) return m <= 1 ? "دقيقة" : m === 2 ? "دقيقتين" : fmtNum(m) + (m <= 10 ? " دقايق" : " دقيقة");

  if (h < 24) return h === 1 ? "ساعة" : h === 2 ? "ساعتين" : fmtNum(h) + (h <= 10 ? " ساعات" : " ساعة");
  const dd = Math.round(d / DAY);
  return dd === 1 ? "يوم" : dd === 2 ? "يومين" : fmtNum(dd) + (dd <= 10 ? " أيام" : " يوم");
}

function dueInfo(t){
  const d = dueMs(t); if (!d) return null;

  return { cls:"", txt:fullDate(d) };
}

/* ====================== Firebase ====================== */
async function makeFirebase(){
  const V = "10.12.2", base = "https://www.gstatic.com/firebasejs/" + V + "/";
  const [AP, A, F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
  const app = AP.initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app), db = F.getFirestore(app);
  const fix = o => { const r = {}; for (const k in o) r[k] = o[k] === NOW ? F.serverTimestamp() : o[k]; return r; };
  const withId = d => ({ id:d.id, ...d.data() });
  async function loadProfile(u){
    const ref = F.doc(db, "users", u.uid);
    let s = await F.getDoc(ref);
    if (!s.exists() && (u.email||"").toLowerCase() === OWNER_EMAIL.toLowerCase()){
      await F.setDoc(ref, { name:"مدير التشغيل", email:u.email, role:"supervisor", active:true, createdAt:F.serverTimestamp() });
      s = await F.getDoc(ref);
    }
    if (!s.exists()) return { blocked:"الحساب ده مش متسجل في السيستم. كلم مدير التشغيل." };
    const p = { uid:u.uid, ...s.data() };
    if (p.active === false) return { blocked:"الحساب ده متوقف. كلم مدير التشغيل." };
    return p;
  }
  return {
    demo:false,
    onAuth(cb){ A.onAuthStateChanged(auth, async u => { if (!u) return cb(null); try { cb(await loadProfile(u)); } catch(e){ console.error(e); cb({ blocked:"مفيش صلاحية للدخول. اتأكد إن قواعد Firestore اتنشرت." }); } }); },
    login:(e,p) => A.signInWithEmailAndPassword(auth, e, p),
    logout:() => A.signOut(auth),
    watchTasks(me, cb){
      const col = F.collection(db, "tasks");
      const err = e => { console.error(e); toast("مش قادر يقرا المهام"); };
      if (me.role !== "employee") return F.onSnapshot(col, s => cb(s.docs.map(withId)), err);
      // الموظف: المهام اللي عليه + المهام اللي حوّل جزء منها لزميل
      // + المهام اللي ليه فيها مسار تنفيذ (مهمة موزعة على أكتر من موظف)
      let a = [], b = [], c = [];
      const emit = () => { const m = new Map(); [...a, ...b, ...c].forEach(t => m.set(t.id, t)); cb([...m.values()]); };
      const u1 = F.onSnapshot(F.query(col, F.where("assignedTo","==",me.uid)), s => { a = s.docs.map(withId); emit(); }, err);
      const u2 = F.onSnapshot(F.query(col, F.where("returnTo","==",me.uid)), s => { b = s.docs.map(withId); emit(); }, e => console.warn(e));
      const u3 = F.onSnapshot(F.query(col, F.where("members","array-contains",me.uid)), s => { c = s.docs.map(withId); emit(); }, e => console.warn(e));
      return () => { u1(); u2(); u3(); };
    },
    watchUsers(cb){ return F.onSnapshot(F.collection(db,"users"), s => cb(s.docs.map(d => ({ uid:d.id, ...d.data() }))), e => console.error(e)); },
    watchUpdates(id, cb){ return F.onSnapshot(F.query(F.collection(db,"tasks",id,"updates"), F.orderBy("createdAt")), s => cb(s.docs.map(withId)), e => console.error(e)); },
    async createTask(data, me, text){
      const counter = F.doc(db, "meta", "counter"), ref = F.doc(F.collection(db, "tasks"));
      await F.runTransaction(db, async tx => {
        const c = await tx.get(counter); const n = (c.exists() ? c.data().n : 0) + 1;
        tx.set(counter, { n });
        tx.set(ref, fix({ ...data, no:n, createdAt:NOW, updatedAt:NOW, lastUpdate:text, lastUpdateBy:me.name, lastUpdateAt:NOW }));
      });
      await F.addDoc(F.collection(db,"tasks",ref.id,"updates"), { kind:"event", text, by:me.uid, byName:me.name, role:me.role, createdAt:F.serverTimestamp() });
      return ref.id;
    },
    async act(id, me, patch, entry){
      const b = F.writeBatch(db);
      b.update(F.doc(db,"tasks",id), fix({ ...patch, updatedAt:NOW, lastUpdate:entry.text.slice(0,160), lastUpdateBy:me.name, lastUpdateAt:NOW }));
      b.set(F.doc(F.collection(db,"tasks",id,"updates")), { kind:entry.kind, text:entry.text, by:me.uid, byName:me.name, role:me.role, createdAt:F.serverTimestamp() });
      await b.commit();
    },
    // تعديل بيقرا آخر نسخة من المهمة الأول (عشان لو اتنين خلّصوا مساراتهم في نفس اللحظة)
    async actTx(id, me, fn){
      const ref = F.doc(db,"tasks",id), up = F.doc(F.collection(db,"tasks",id,"updates"));
      await F.runTransaction(db, async tx => {
        const s = await tx.get(ref); if (!s.exists()) throw new Error("gone");
        const r = fn({ id, ...s.data() }); if (!r) throw new Error("noop");
        tx.update(ref, fix({ ...r.patch, updatedAt:NOW, lastUpdate:r.entry.text.slice(0,160), lastUpdateBy:me.name, lastUpdateAt:NOW }));
        tx.set(up, { kind:r.entry.kind, text:r.entry.text, by:me.uid, byName:me.name, role:me.role, createdAt:F.serverTimestamp() });
      });
    },
    deleteTask:id => F.deleteDoc(F.doc(db,"tasks",id)),
    async createUser({ name, email, password, role }){
      const sec = AP.initializeApp(FIREBASE_CONFIG, "sec-" + Date.now());
      try {
        const sa = A.getAuth(sec);
        const cred = await A.createUserWithEmailAndPassword(sa, email, password);
        await F.setDoc(F.doc(db,"users",cred.user.uid), { name, email, role, active:true, createdAt:F.serverTimestamp() });
        await A.signOut(sa);
      } finally { await AP.deleteApp(sec); }
    },
    updateUser:(uid, patch) => F.updateDoc(F.doc(db,"users",uid), patch),
    watchAtt(me, cb){ const col = F.collection(db,"attendance");
      const from = dayKey(new Date(new Date().getFullYear(), new Date().getMonth() - 5, 1));
      const q = me.role === "employee" ? F.query(col, F.where("uid","==",me.uid)) : F.query(col, F.where("day",">=",from));
      return F.onSnapshot(q, s => cb(s.docs.map(withId)), e => console.warn(e)); },
    async punch(me, open, code, pos){
      const loc = { Lat:pos.lat, Lng:pos.lng, Acc:Math.round(pos.acc) };
      if (open) await F.updateDoc(F.doc(db,"attendance",open.id), { outAt:F.serverTimestamp(), outLat:loc.Lat, outLng:loc.Lng, outAcc:loc.Acc, outCode:code });
      else await F.addDoc(F.collection(db,"attendance"), { uid:me.uid, name:me.name, day:dayKey(Date.now()), inAt:F.serverTimestamp(), inLat:loc.Lat, inLng:loc.Lng, inAcc:loc.Acc, inCode:code });
    },
    async getOffice(){ const d = await F.getDoc(F.doc(db,"settings","office")); return d.exists() ? d.data() : null; },
    setOffice:o => F.setDoc(F.doc(db,"settings","office"), o, { merge:true }),
    addAtt:r => F.addDoc(F.collection(db,"attendance"), { ...r, inAt:F.Timestamp.fromMillis(r.inAt), ...(r.outAt ? { outAt:F.Timestamp.fromMillis(r.outAt) } : {}) }),
    editAtt:(id, r) => F.updateDoc(F.doc(db,"attendance",id), { ...r, inAt:F.Timestamp.fromMillis(r.inAt), ...(r.outAt ? { outAt:F.Timestamp.fromMillis(r.outAt) } : { outAt:F.deleteField() }) }),
    delAtt:id => F.deleteDoc(F.doc(db,"attendance",id)),
    async clearAtt(){ const all = await F.getDocs(F.collection(db,"attendance")); let n = 0;
      for (let i = 0; i < all.docs.length; i += 400){ const b = F.writeBatch(db); all.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); n += Math.min(400, all.docs.length - i); }
      return n; },
    resetPassword:email => A.sendPasswordResetEmail(auth, email),
    async lookupArchive(ref){ const d = await F.getDoc(F.doc(db,"archive",ref)); return d.exists() ? d.data() : null; },
    watchSheet(id, cb){ return F.onSnapshot(F.query(F.collection(db,"tasks",id,"sheet"), F.orderBy("n")), s => cb(s.docs.map(withId)), e => console.warn(e)); },
    async addSheetRows(id, rows){ const b = F.writeBatch(db); rows.forEach(r => b.set(F.doc(F.collection(db,"tasks",id,"sheet")), r)); await b.commit(); },
    updateSheetRow:(id, rid, patch) => F.updateDoc(F.doc(db,"tasks",id,"sheet",rid), patch),
    deleteSheetRow:(id, rid) => F.deleteDoc(F.doc(db,"tasks",id,"sheet",rid))
  };
}

function perfRange(){

  if (S.perf === "last") return [new Date(n.getFullYear(), n.getMonth() - 1, 1).getTime(), new Date(n.getFullYear(), n.getMonth(), 1).getTime()];

function statsFor(uid){
  const [a, b] = perfRange();
  const mine = S.tasks.filter(t => t.assignedTo === uid || (t.tracks && t.tracks[uid]));
  const trk = t => t.tracks && t.tracks[uid];   // في المهام الموزعة: حساب كل واحد بمساره هو
  const fin = t => trk(t) && trk(t).doneAt ? ms(trk(t).doneAt) : ms(t.closedAt);
  const closed = mine.filter(t => t.status === "closed" && t.closedAt && ms(t.closedAt) >= a && ms(t.closedAt) < b);
  const withDue = closed.filter(t => dueMs(t));
  const onTime = withDue.filter(t => fin(t) <= dueMs(t));
  const rated = closed.filter(t => t.rating);
  const dur = closed.filter(t => trk(t) ? trk(t).at : t.assignedAt).map(t => trk(t) ? fin(t) - ms(trk(t).at) : ms(t.closedAt) - ms(t.assignedAt));
  return { closed:closed.length, onTimePct: withDue.length ? Math.round(onTime.length / withDue.length * 100) : null,
    avg: rated.length ? rated.reduce((s,t) => s + t.rating, 0) / rated.length : null, nRated:rated.length,
    avgDur: dur.length ? dur.reduce((s,x) => s + x, 0) / dur.length : null,
    open: mine.filter(t => t.status !== "closed" && !(trk(t) && trk(t).status === "done")).length, late: mine.filter(t => isLate(t) && !(trk(t) && trk(t).status === "done")).length,

}

    }

  };
  loop();
}

const repeatEvery = () => store.get("repeat", 15) * MIN;
function alertList(){
  const now = Date.now(), lim = alertBefore(), emp = S.me.role === "employee";
  const pool = S.tasks.filter(t => t.status !== "closed" && t.status !== "pending_approval" && dueMs(t) && (!emp || mine(t)));
  return { late: pool.filter(t => dueMs(t) < now).sort((a,b) => dueMs(a) - dueMs(b)),
           soon: pool.filter(t => dueMs(t) >= now && dueMs(t) - now <= lim).sort((a,b) => dueMs(a) - dueMs(b)),
           ext: emp ? [] : S.tasks.filter(t => t.extReq && t.status !== "closed") };
}
const escalating = new Set();
function checkAlerts(silent){
  if (!S.me) return;
  const { late, soon, ext } = alertList(), now = Date.now();
  const b = $("#bellBadge"); if (b){ const n = late.length + soon.length + ext.length; b.hidden = !n; b.textContent = fmtNum(n); }
  if ($(".pop")) renderPop();
  // 1) إشعار مرة واحدة لكل تغيير حالة
  const seen = store.get("seen:" + S.me.uid, {}), fresh = [];
  late.forEach(t => { const k = t.id + ":late"; if (seen[k] !== dueMs(t)){ seen[k] = dueMs(t); fresh.push([t,"late"]); } });
  soon.forEach(t => { const k = t.id + ":soon"; if (seen[k] !== dueMs(t)){ seen[k] = dueMs(t); fresh.push([t,"soon"]); } });
  ext.forEach(t => { const k = t.id + ":ext"; if (seen[k] !== ms(t.extReq.reqAt)){ seen[k] = ms(t.extReq.reqAt); fresh.push([t,"ext"]); } });
  store.set("seen:" + S.me.uid, seen);
  // 2) لو المهمة بتاعتي عدّى ميعادها: سجل في السجل وابعت للإدارة (مرة واحدة)
  late.filter(t => mine(t) && !t.escalatedAt && !escalating.has(t.id)).forEach(t => { escalating.add(t.id);
    runAct(t, "escalate", { silent:true }); });
  // 3) الشاشة المنبثقة للمهام اللي عليّا، وبتتكرر كل فترة لحد ما تتحدث
  const myHot = [...late, ...soon].filter(t => mine(t) && !t.extReq);
  const freshMine = fresh.some(([t,k]) => k !== "ext" && mine(t));
  const lastPop = store.get("lastPop:" + S.me.uid, 0);
  if (myHot.length && !$(".dl-modal") && (freshMine || now - lastPop >= repeatEvery() || silent && now - lastPop >= 5*MIN)){
    store.set("lastPop:" + S.me.uid, now); showDeadline(myHot);
    beep(); notifyDevice(myHot[0], dueMs(myHot[0]) < now ? "مهمة عدّى ميعادها" : "مهمة قرّب ميعادها", myHot.length);
    return;
  }
  if (silent || !fresh.length) return;
  const [t, k] = fresh.find(f => f[1] === "late") || fresh.find(f => f[1] === "ext") || fresh[0];
  const title = k === "late" ? "مهمة عدّى ميعادها" : k === "ext" ? "طلب مد وقت من " + t.extReq.byName : "مهمة قرّب ميعادها";
  toast(title + ": #" + pad(t.no) + " " + t.title); beep(); notifyDevice(t, title, fresh.length);
}

    case "escalate": patch = { escalatedAt:NOW }; entry = { kind:"event", text:"عدّى ميعاد التنفيذ والمهمة لسه ما خلصتش — اتبعت تنبيه للإدارة" }; break;

    case "done": patch = { status:"pending_approval" }; entry = { kind:"event", text:"أنهى المهمة وأرسلها للاعتماد" + (text ? ":\n" + text : "") }; break;
    case "approve": case "rate": {
      const note = $("#rateNote") ? $("#rateNote").value.trim() : "";
      if (kind === "rate" && !S.stars){ toast("اختار عدد النجوم الأول"); return false; }

    case "return": if (!text){ $("#updText").focus(); toast("اكتب سبب الإرجاع في خانة التحديث تحت"); return false; }

}

// كل حركات المسارات بتتعمل على آخر نسخة من المهمة (transaction)
async function trackAct(t, kind, { text = "", val, btn } = {}){
  const me = S.me, now = Date.now();
  let picks = [], newSt = t.status;
  const convNote = t.assignedTo && $("#sn-" + t.assignedTo) ? $("#sn-" + t.assignedTo).value.trim() : "";
  if (kind === "split"){
    sheetEl.querySelectorAll("[data-split]:checked").forEach(c => { const u = S.users.find(x => x.uid === c.dataset.split); if (u) picks.push({ uid:u.uid, name:u.name, note:($("#sn-" + u.uid) || {}).value?.trim() || "" }); });
    if (!picks.length){ toast("اختار موظف واحد على الأقل"); return false; }
    if (!hasTracks(t) && !t.assignedTo && picks.length < 2){ toast("اختار موظفين اتنين على الأقل، أو وزّعها عادي على موظف واحد"); return false; }
  }
  if (kind === "return" && !text){ $("#updText").focus(); toast("اكتب سبب الإرجاع في خانة التحديث تحت"); return false; }
  const fn = cur => {
    const tr = JSON.parse(JSON.stringify(cur.tracks || {}));
    let msg = "";
    if (kind === "tstart"){ const x = tr[me.uid]; if (!x || x.status !== "assigned") return null;
      x.status = "in_progress"; x.startedAt = now; msg = "بدأ مساره" + (x.note ? ": " + x.note : ""); }
    else if (kind === "tdone"){ const x = tr[me.uid]; if (!x || x.status === "done") return null;
      x.status = "done"; x.doneAt = now; x.doneNote = text; if (!x.startedAt) x.startedAt = now;
      msg = "خلّص مساره" + (x.note ? " (" + x.note + ")" : "") + (text ? ":\n" + text : ""); }
    else if (kind === "split"){
      const conv = !Object.keys(tr).length;
      let o = Object.values(tr).reduce((m, x) => Math.max(m, x.order || 0), 0);
      if (conv && cur.assignedTo) tr[cur.assignedTo] = { name:cur.assignedToName, note:cur.assignedTo === t.assignedTo ? convNote : "", order:++o, at:now,
        status: cur.status === "in_progress" ? "in_progress" : cur.status === "pending_approval" ? "done" : "assigned" };
      const added = picks.filter(p => !tr[p.uid]);
      if (!added.length) return null;
      added.forEach(p => tr[p.uid] = { name:p.name, note:p.note, status:"assigned", order:++o, at:now });
      const lines = (conv ? trackList({ tracks:tr }) : added.map(p => ({ ...tr[p.uid] }))).map(x => "• " + x.name + (x.note ? ": " + x.note : "")).join("\n");
      msg = (conv ? "وزّع المهمة على أكتر من موظف:\n" : "ضاف " + (added.length === 1 ? "مسار" : "مسارات") + ":\n") + lines; }
    else if (kind === "tdel"){ const x = tr[val]; if (!x || Object.keys(tr).length < 2) return null;
      delete tr[val]; msg = "شال مسار " + x.name + (x.note ? " (" + x.note + ")" : ""); }
    else if (kind === "tback"){ const x = tr[val]; if (!x || x.status !== "done") return null;
      x.status = "in_progress"; x.doneAt = null; msg = "رجّع مسار " + x.name + " للتعديل" + (text ? ":\n" + text : ""); }
    else if (kind === "return"){ Object.values(tr).forEach(x => { if (x.status === "done"){ x.status = "in_progress"; x.doneAt = null; } });
      msg = "رجّع المهمة للتعديل (كل المسارات):\n" + text; }
    else if (kind === "reopen"){ Object.values(tr).forEach(x => { x.status = "assigned"; x.doneAt = null; x.startedAt = null; });
      msg = "أعاد فتح المهمة" + (text ? ":\n" + text : ""); }
    if (cur.status === "closed" && kind !== "reopen") return null;
    const st = trackStatus(tr), patch = { tracks:tr }; newSt = st;
    if (st !== cur.status) patch.status = st;
    if (me.role !== "employee"){ patch.members = Object.keys(tr); patch.assignedTo = ""; patch.assignedToName = trackNames(tr); }
    if (kind === "split"){ patch.returnTo = ""; patch.returnToName = ""; patch.handoffNote = ""; if (!cur.assignedAt) patch.assignedAt = NOW; }
    if (st === "pending_approval" && cur.status !== "pending_approval") msg += "\n— كل المسارات خلصت، والمهمة اتبعتت للاعتماد";
    return { patch, entry:{ kind:"event", text:msg } };
  };
  if (btn) btn.disabled = true;
  try {
    await api.actTx(t.id, me, fn);
    toast({ tstart:"بالتوفيق!", tdone:"مسارك اتسجل إنه خلص", split:"المهمة اتوزعت كمسارات", tdel:"المسار اتشال", tback:"المسار رجع للموظف", return:"المهمة رجعت للمسارات", reopen:"المهمة اتفتحت تاني" }[kind]
      + (kind === "tdone" && newSt === "pending_approval" ? " — والمهمة راحت للاعتماد" : ""));
    return true;
  } catch(x){ console.error(x); toast(x.message === "noop" ? "الحالة اتغيرت، حدّث الصفحة" : "العملية ما نجحتش، جرّب تاني"); return false; }
  finally { if (btn) btn.disabled = false; }
}

    <div class="field full"><label for="nt-due">ميعاد التنفيذ</label><div class="chips-row">${DEADLINES.map((d,i) => `<button type="button" class="chip" data-dl="${i}">${d[0]}</button>`).join("")}</div><input id="nt-due" type="datetime-local"></div>
    <div class="field"><label for="nt-client">العميل</label><input id="nt-client"></div>
    <div class="field"><label for="nt-phone">تليفون العميل</label><input id="nt-phone" type="tel" dir="ltr" placeholder="01xxxxxxxxx"></div>
    ${sup ? `<div class="field full"><span class="lbl">توزيع على <small class="hint">— اختار واحد أو أكتر، ولو اخترت أكتر من واحد المهمة هتبقى ملف واحد فيه مسار لكل موظف</small></span><div class="type-pick" id="nt-assign">${staff().map(u => `<button type="button" data-asg="${u.uid}" aria-pressed="false">${esc(u.uid === S.me.uid ? u.name + " (أنا)" : u.name)}</button>`).join("")}</div><div class="nt-notes" id="nt-notes"></div></div>` : ""}
    <div class="field full"><label for="nt-details">التفاصيل</label><textarea id="nt-details" rows="3"></textarea></div>
    <p class="err" id="nt-err" hidden></p>
    </form><div class="form-foot"><button class="btn primary" id="ntSave">${sup ? "حفظ المهمة" : "إرسال لمدير التشغيل"}</button><button class="btn ghost" data-x>إلغاء</button></div>`);
  let pri = "normal"; const asg = [];
  const drawNotes = () => { const box = $("#nt-notes"); if (!box) return;
    const keep = {}; box.querySelectorAll("input").forEach(i => keep[i.id] = i.value);
    box.innerHTML = asg.length < 2 ? "" : `<span class="hint">المطلوب من كل واحد (اختياري):</span>` + asg.map(uid => { const u = S.users.find(x => x.uid === uid);
      return `<div class="split-row"><span>${esc(u.name)}</span><input type="text" id="ntn-${uid}" placeholder="مثلاً: حجز الفنادق" value="${esc(keep["ntn-" + uid] || "")}"></div>`; }).join(""); };
  m.addEventListener("click", e => {
    const ag = e.target.closest("[data-asg]"); if (ag){ const uid = ag.dataset.asg, i = asg.indexOf(uid);
      if (i < 0) asg.push(uid); else asg.splice(i, 1);
      ag.classList.toggle("on", i < 0); ag.setAttribute("aria-pressed", String(i < 0)); drawNotes(); }
    const ty = e.target.closest("[data-type]"); if (ty){ type = ty.dataset.type; m.querySelectorAll("[data-type]").forEach(b => b.classList.toggle("on", b === ty)); }
    const pr = e.target.closest("[data-pri]"); if (pr){ pri = pr.dataset.pri; m.querySelectorAll("[data-pri]").forEach(b => b.classList.toggle("on", b === pr)); }
    const dl = e.target.closest("[data-dl]"); if (dl){ $("#nt-due").value = toInput(DEADLINES[+dl.dataset.dl][1]()); m.querySelectorAll("[data-dl]").forEach(b => b.classList.toggle("on", b === dl)); }
  });
  $("#nt-title").focus();
  const save = async () => {
    const title = $("#nt-title").value.trim(), er = $("#nt-err");
    if (!title){ er.textContent = "اكتب عنوان المهمة."; er.hidden = false; return; }
    const multi = sup && asg.length > 1, au = sup && asg.length === 1 ? S.users.find(u => u.uid === asg[0]) : null;
    const dv = $("#nt-due").value;
    const data = { title, type, priority:pri, client:$("#nt-client").value.trim(), phone:$("#nt-phone").value.trim(),
      dueAt: dv ? new Date(dv).getTime() : null, details:$("#nt-details").value.trim(), status: au ? "assigned" : "new", assignedTo: au ? au.uid : "", assignedToName: au ? au.name : "",
      createdBy:S.me.uid, createdByName:S.me.name, createdByRole:S.me.role };
    if (au) data.assignedAt = NOW;
    let first = au ? "أنشأ المهمة ووزّعها على " + au.name : "أنشأ المهمة";
    if (multi){
      const tracks = {}, now = Date.now();
      asg.forEach((uid, i) => { const u = S.users.find(x => x.uid === uid); tracks[uid] = { name:u.name, note:($("#ntn-" + uid) || {}).value?.trim() || "", status:"assigned", order:i + 1, at:now }; });
      Object.assign(data, { tracks, members:Object.keys(tracks), status:"assigned", assignedTo:"", assignedToName:trackNames(tracks), assignedAt:NOW });
      first = "أنشأ المهمة ووزّعها على أكتر من موظف:\n" + trackList({ tracks }).map(x => "• " + x.name + (x.note ? ": " + x.note : "")).join("\n");
    }
    $("#ntSave").disabled = true;
    try {
      await api.createTask(data, S.me, first);
      m.remove(); toast(sup ? "المهمة اتحفظت" : "المهمة اتبعتت لمدير التشغيل"); S.tab = "open"; S.view = "list"; renderView();
    } catch(x){ console.error(x); er.textContent = "الحفظ ما نجحش. اتأكد من النت وجرّب تاني."; er.hidden = false; $("#ntSave").disabled = false; }
  };
  $("#ntSave").onclick = save;
  $("#ntForm").addEventListener("submit", e => { e.preventDefault(); save(); });
}

/* ---------- فريق العمل ---------- */
function openTeam(){
  const m = modal("فريق العمل", `<ul class="users" id="uList"></ul>
    <h3 class="sub-h">إضافة حساب</h3>
    <form class="form" id="uForm" novalidate>
      <div class="field"><label for="u-name">الاسم</label><input id="u-name" required></div>
      <div class="field"><label for="u-role">الدور</label><select id="u-role"><option value="employee">موظف</option><option value="manager">المدير العام</option><option value="supervisor">مدير تشغيل</option><option value="kiosk">جهاز الحضور (شاشة الكود في الشركة)</option></select></div>
      <div class="field"><label for="u-email">الإيميل</label><input id="u-email" type="email" dir="ltr" required></div>
      <div class="field"><label for="u-pass">كلمة السر (٦ حروف على الأقل)</label><input id="u-pass" type="text" dir="ltr" required></div>
      <p class="err" id="u-err" hidden></p>
    </form><div class="form-foot"><button class="btn primary" id="uSave">إضافة الحساب</button></div>`);
  const order = ["supervisor","manager","employee"];
  const draw = () => {
    if (!document.body.contains(m)) return;
    $("#uList").innerHTML = S.users.slice().sort((a,b) => order.indexOf(a.role) - order.indexOf(b.role))
      .map(u => `<li class="${u.active === false ? "off" : ""}">${avatar(u.name, u.uid)}<div class="u-main"><b>${esc(u.name)}</b><span>${ROLE[u.role]} — <span dir="ltr">${esc(u.email)}</span>${u.active === false ? " — متوقف" : ""}</span></div>
        ${u.uid === S.me.uid ? "" : `<button class="btn sm" data-reset="${esc(u.email)}">إعادة تعيين كلمة السر</button><button class="btn sm" data-toggle="${u.uid}">${u.active === false ? "تفعيل" : "إيقاف"}</button>`}</li>`).join("");
  };
  draw(); const un = api.watchUsers(us => { S.users = us; draw(); });
  new MutationObserver((_, o) => { if (!document.body.contains(m)){ un(); o.disconnect(); } }).observe(document.body, { childList:true });
  m.addEventListener("click", async e => {
    const tg = e.target.closest("[data-toggle]"), rs = e.target.closest("[data-reset]");
    if (tg){ const u = S.users.find(x => x.uid === tg.dataset.toggle); await api.updateUser(u.uid, { active: u.active === false }); toast(u.active === false ? "الحساب اتفعّل" : "الحساب اتوقف"); }
    if (rs){ try { await api.resetPassword(rs.dataset.reset); toast(DEMO ? "في النسخة الحقيقية هيوصله إيميل لتغيير كلمة السر" : "اتبعت إيميل تغيير كلمة السر"); } catch(x){ toast("ما قدرتش أبعت الإيميل"); } }
  });
  $("#uSave").onclick = async () => {
    const er = $("#u-err"), name = $("#u-name").value.trim(), email = $("#u-email").value.trim(), password = $("#u-pass").value, role = $("#u-role").value;
    er.hidden = true;
    if (!name || !email || password.length < 6){ er.textContent = "اكتب الاسم والإيميل وكلمة سر ٦ حروف أو أكتر."; er.hidden = false; return; }
    $("#uSave").disabled = true;
    try { await api.createUser({ name, email, password, role }); ["u-name","u-email","u-pass"].forEach(i => $("#"+i).value = ""); toast("الحساب اتعمل. ابعت الإيميل وكلمة السر للشخص."); }
    catch(x){ console.error(x); er.textContent = x.code === "auth/email-already-in-use" ? "الإيميل ده مستخدم قبل كده." : x.code === "auth/invalid-email" ? "الإيميل مكتوب غلط." : "ما قدرتش أعمل الحساب."; er.hidden = false; }
    finally { $("#uSave").disabled = false; }
  };
}

if (DEMO) api.demoLogin("sup");

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشة الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one full-screen panel for the office device — clock on top, big rotating QR in the middle, short code and countdown under it */
:root{ --brand:#0a4c54; --brand-2:#0e5f68; --ink:#10252b; --paper:#ffffff; --muted:#a9cfd2; --gold:#d8961a; --bad:#f07468;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--brand);color:var(--paper);font:16px/1.6 var(--f-body)}
button,input{font:inherit}
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center}
.clock{font:600 clamp(40px,9vw,88px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.date{color:var(--muted);font-size:clamp(16px,2.4vw,22px);margin-top:-8px}
.qr{background:var(--paper);border-radius:22px;padding:18px;width:min(78vmin,440px);aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.qr svg{width:100%;height:100%;display:block}
.code{font:700 clamp(30px,6vw,52px)/1 var(--f-display);letter-spacing:.18em;direction:ltr;color:var(--gold)}
.timer{width:min(78vmin,440px);max-width:100%;height:8px;border-radius:99px;background:var(--brand-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.hint{color:var(--muted);max-width:520px;margin:0}
.err{color:var(--bad);margin:0}
form{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:right}
form h1{font:700 22px/1.3 var(--f-display);margin:0}
form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5a6e74}
form input{border:1px solid #d6e0e1;border-radius:9px;padding:9px 12px;background:#f4f7f7;color:var(--ink)}
form button{border:0;border-radius:9px;padding:10px;background:var(--brand);color:var(--paper);font-weight:600;cursor:pointer}
.offline{position:fixed;top:12px;right:50%;transform:translateX(50%);background:var(--bad);color:var(--ink);padding:6px 14px;border-radius:9px;font-weight:600}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar"></div>
<script src="qrcode.js"></script>
<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD-7latIkGl3vQ4dE8lapKDOIREBMkz-hg",
  authDomain: "tasks-ops.firebaseapp.com",
  projectId: "tasks-ops",
  storageBucket: "tasks-ops.firebasestorage.app",
  messagingSenderId: "773091705898",
  appId: "1:773091705898:web:4ae08acc81d0067dd2ef53"
};
const OWNER_EMAIL = "khaledalhadedy001@gmail.com";
const DEMO = location.protocol === "file:";
const EVERY = 30; // ثانية
const $ = s => document.querySelector(s);
const app = $("#app");
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode = () => { const a = new Uint32Array(6); crypto.getRandomValues(a); return [...a].map(x => ALPHA[x % ALPHA.length]).join(""); };
const appUrl = code => new URL("./#att-" + code, location.href).href;

let F, db, auth, A;
let current = "", left = EVERY;
if (!DEMO){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [AP, AA, FF] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
  const fbApp = AP.initializeApp(FIREBASE_CONFIG); A = AA; F = FF; auth = A.getAuth(fbApp); db = F.getFirestore(fbApp);
  A.onAuthStateChanged(auth, async u => {
    if (!u) return login();
    const s = await F.getDoc(F.doc(db, "users", u.uid)).catch(() => null);
    const role = s && s.exists() ? s.data().role : (u.email || "").toLowerCase() === OWNER_EMAIL ? "supervisor" : "";
    if (role !== "kiosk" && role !== "supervisor") return login("الحساب ده مش مسموح له يشغّل شاشة الحضور. استخدم حساب «جهاز الحضور» أو حساب مدير التشغيل.");
    start();
  });
} else start();

function login(err){
  app.innerHTML = `<div class="screen"><form id="f" novalidate><h1>شاشة الحضور</h1><p style="margin:0;color:#5a6e74;font-size:14px">ادخل بحساب «جهاز الحضور» اللي عملته من صفحة الفريق.</p>
    <label>الإيميل<input id="e" type="email" dir="ltr" autocomplete="username"></label><label>كلمة السر<input id="p" type="password" dir="ltr" autocomplete="current-password"></label>
    <p class="err" id="er" ${err ? "" : "hidden"}>${err || ""}</p><button>تشغيل الشاشة</button></form></div>`;
  $("#f").onsubmit = async e => { e.preventDefault(); try { await A.signInWithEmailAndPassword(auth, $("#e").value.trim(), $("#p").value); } catch { $("#er").textContent = "الإيميل أو كلمة السر غلط."; $("#er").hidden = false; } };
}

function start(){
  app.innerHTML = `<div class="screen"><div class="clock" id="clock"></div><div class="date" id="date"></div>
    <div class="qr" id="qr" role="img" aria-label="كود الحضور"></div><div class="code" id="code"></div>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>
    <p class="hint">صوّر الكود بكاميرا الموبايل عشان تسجّل حضور أو انصراف. أو افتح السيستم واكتب الحروف اللي تحت الكود. الكود بيتغير كل ${EVERY} ثانية.</p></div>`;
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch {}
  rotate(); tick(); setInterval(tick, 1000);
}
function tick(){
  const n = new Date();
  $("#clock").textContent = n.toLocaleTimeString("ar-EG", { hour:"numeric", minute:"2-digit", second:"2-digit" });
  $("#date").textContent = n.toLocaleDateString("ar-EG", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  left--; $("#bar").style.width = Math.max(0, left / EVERY * 100) + "%";
  if (left <= 0) rotate();
}
async function rotate(){
  const code = newCode(), prev = current;
  try {
    if (!DEMO) await F.setDoc(F.doc(db, "attKiosk", "current"), { code, prev: prev || "", at:F.serverTimestamp() });
    current = code; left = EVERY;
    const q = qrcode(0, "M"); q.addData(appUrl(code)); q.make();
    $("#qr").innerHTML = q.createSvgTag({ cellSize:8, margin:2, scalable:true });
    $("#code").textContent = code;
    document.querySelector(".offline")?.remove();
  } catch(e){ console.error(e); left = 5;
    if (!document.querySelector(".offline")){ const d = document.createElement("div"); d.className = "offline"; d.textContent = "مفيش اتصال — بيحاول تاني"; document.body.appendChild(d); } }
}
</script>
</body>
</html>
